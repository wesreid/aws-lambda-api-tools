name: Publish Package to NPM

on:
  push:
    branches: [ main ]

# Add permissions block at workflow level
permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Build
        run: npm run build
      
      - name: Commit built files
        run: |
          git add .
          git commit -m "chore: update built files" || echo "No changes to commit"
      
      # The version commit stays local until npm has the package. Pushing it
      # first let a failed publish leave main on a version npm never received
      # (0.1.49).
      - name: Bump version
        run: npm run bump-version

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm now has this version, so it must reach main: if main moved during
      # the run, replay the version commit on top of it instead of failing.
      - name: Push version commit
        run: git push || (git pull --rebase origin main && git push)
